{% extends 'irumvajeanmarie/base.html' %}

{% block title %}Password Reset Complete - UAS Portal{% endblock %}

{% block content %}
<div style="max-width: 450px; margin: 40px auto; text-align: center;">
    <div class="card">
        <div style="background: #e8fdf0; width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem;">
            <svg style="width: 32px; height: 32px; color: #27ae60;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
        </div>
        <h1 style="font-size: 1.5rem; color: var(--nav-bg); margin-bottom: 1rem;">Success!</h1>
        <p style="color: var(--text-muted); line-height: 1.6; margin-bottom: 2rem;">
            Your password has been successfully reset. You can now use your new password to sign in.
        </p>
        <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border-color);">
            <a href="{% url 'irumvajeanmarie:login' %}" class="btn" style="text-decoration: none; width: 100%;">Return to Login</a>
        </div>
    </div>
</div>
{% endblock %}
