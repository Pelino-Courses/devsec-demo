{% extends 'uwase05/base.html' %}

{% block title %}Register{% endblock %}
{% block header %}Create an account{% endblock %}

{% block content %}
<form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
        <div class="field">
            {{ field.label_tag }}
            {{ field }}
            {{ field.errors }}
        </div>
    {% endfor %}
    <button type="submit">Register</button>
</form>
{% endblock %}
