<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Your Email</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-lg bg-slate-900/95 border border-white/10 rounded-3xl shadow-2xl p-8 text-center">
        <h1 class="text-3xl font-bold mb-4">Check your email</h1>
        <p class="text-gray-300 mb-6">If an account exists for that email address, we've sent a password reset link. For security, we show the same message either way.</p>
        <a href="{% url 'login' %}" class="inline-flex items-center justify-center rounded-2xl bg-gradient-to-r from-blue-500 to-cyan-500 px-6 py-3 text-white font-semibold hover:from-blue-600 hover:to-cyan-600 transition-all">
            Back to sign in
        </a>
    </div>
</body>
</html>
