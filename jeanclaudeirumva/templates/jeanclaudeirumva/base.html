<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}UAS Auth Service{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; width: 100%; }
        button:hover { background-color: #0056b3; }
        .messages { margin-bottom: 15px; }
        .messages .success { color: green; background: #d4edda; padding: 10px; border-radius: 4px; }
        .messages .error { color: red; background: #f8d7da; padding: 10px; border-radius: 4px; }
        .errorlist { color: red; list-style: none; padding: 0; font-size: 0.9em; }
        a { color: #007bff; }
        .nav { margin-bottom: 20px; }
        .nav a { margin-right: 15px; }
    </style>
</head>
<body>
    <div class="nav">
        {% if user.is_authenticated %}
            <a href="{% url 'jeanclaudeirumva:dashboard' %}">Dashboard</a>
            <a href="{% url 'jeanclaudeirumva:profile' %}">Profile</a>
            <a href="{% url 'jeanclaudeirumva:password_change' %}">Change Password</a>
        {% else %}
            <a href="{% url 'jeanclaudeirumva:login' %}">Login</a>
            <a href="{% url 'jeanclaudeirumva:register' %}">Register</a>
        {% endif %}
    </div>

    {% if messages %}
    <div class="messages">
        {% for message in messages %}
            <div class="{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    </div>
    {% endif %}

    {% block content %}{% endblock %}
</body>
</html>
