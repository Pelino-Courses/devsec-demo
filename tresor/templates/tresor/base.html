<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}UAS{% endblock %}</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
        nav { margin-bottom: 20px; }
        nav a { margin-right: 10px; }
        .messages { list-style: none; padding: 0; }
        .messages li { padding: 8px; margin-bottom: 8px; border-radius: 4px; }
        .messages li.success { background: #d4edda; }
        .messages li.error { background: #f8d7da; }
        .messages li.info { background: #d1ecf1; }
        label { display: block; margin-top: 10px; }
        input[type="text"], input[type="email"], input[type="password"], textarea {
            width: 100%; padding: 6px; box-sizing: border-box;
        }
        button, input[type="submit"] { margin-top: 14px; padding: 8px 16px; cursor: pointer; }
        .errorlist { color: red; font-size: 0.85em; padding-left: 0; list-style: none; }
    </style>
</head>
<body>
<nav>
    {% if user.is_authenticated %}
        <a href="{% url 'tresor:dashboard' %}">Dashboard</a>
        <a href="{% url 'tresor:profile' %}">Profile</a>
        <a href="{% url 'tresor:password_change' %}">Change Password</a>
        <form method="post" action="{% url 'tresor:logout' %}" style="display:inline">
            {% csrf_token %}
            <button type="submit">Logout</button>
        </form>
    {% else %}
        <a href="{% url 'tresor:login' %}">Login</a>
        <a href="{% url 'tresor:register' %}">Register</a>
    {% endif %}
</nav>

{% if messages %}
<ul class="messages">
    {% for message in messages %}
    <li class="{{ message.tags }}">{{ message }}</li>
    {% endfor %}
</ul>
{% endif %}

{% block content %}{% endblock %}
</body>
</html>
