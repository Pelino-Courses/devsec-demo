{% extends "tresor/base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<h2>Login</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Login</button>
</form>
<p>No account yet? <a href="{% url 'tresor:register' %}">Register</a></p>
<p><a href="{% url 'tresor:password_reset' %}">Forgot your password?</a></p>
{% endblock %}
