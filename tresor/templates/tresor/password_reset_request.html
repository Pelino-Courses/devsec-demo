{% extends "tresor/base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<h2>Reset your password</h2>
<p>Enter your email address and we will send you a reset link if an account exists.</p>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Send reset link</button>
</form>
<p><a href="{% url 'tresor:login' %}">Back to login</a></p>
{% endblock %}
