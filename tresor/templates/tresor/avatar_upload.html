{% extends "tresor/base.html" %}
{% block title %}Upload Avatar{% endblock %}
{% block content %}
<h2>Upload Avatar</h2>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Upload</button>
</form>
<p><a href="{% url 'tresor:profile' %}">Cancel</a></p>
{% endblock %}
