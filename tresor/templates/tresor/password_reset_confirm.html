{% extends "tresor/base.html" %}
{% block title %}Set New Password{% endblock %}
{% block content %}
<h2>Set a new password</h2>
{% if validlink %}
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Set password</button>
</form>
{% else %}
<p>This reset link is invalid or has expired. Please <a href="{% url 'tresor:password_reset' %}">request a new one</a>.</p>
{% endif %}
{% endblock %}
