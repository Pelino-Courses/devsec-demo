<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-lg bg-slate-900/95 border border-white/10 rounded-3xl shadow-2xl p-8">
        <h1 class="text-3xl font-bold mb-4">Password Reset</h1>
        <p class="text-gray-300 mb-6">Enter your email and we’ll send a secure reset link if an account exists. This response does not reveal whether the email is registered.</p>

        <form method="post" class="space-y-5">
            {% csrf_token %}
            {% if form.email.errors %}
            <div class="rounded-lg bg-red-500/20 border border-red-500/50 p-4 text-red-200">
                {{ form.email.errors.as_text }}
            </div>
            {% endif %}

            <label class="block text-sm font-medium text-gray-300" for="id_email">Email address</label>
            <input id="id_email" type="email" name="email" required
                class="w-full rounded-2xl border border-white/10 bg-slate-950/80 px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="you@example.com">

            <button type="submit" class="w-full rounded-2xl bg-gradient-to-r from-blue-500 to-cyan-500 py-3 font-semibold text-white hover:from-blue-600 hover:to-cyan-600 transition-all">
                Send reset link
            </button>
        </form>

        <div class="mt-6 text-sm text-gray-400">
            <a href="{% url 'login' %}" class="text-blue-400 hover:text-blue-300">Back to sign in</a>
        </div>
    </div>
</body>
</html>
