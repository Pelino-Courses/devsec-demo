<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - Student Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
</head>
<body class="bg-gradient-to-br from-slate-900 via-blue-900 to-slate-900 min-h-screen flex items-center justify-center">
    <div class="absolute inset-0 bg-[url('data:image/svg+xml,%3Csvg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg"%3E%3Cg fill="none" fill-rule="evenodd"%3E%3Cg fill="%23ffffff" fill-opacity="0.05"%3E%3Cpath d="M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z"/%3E%3C/g%3E%3C/g%3E%3C/svg%3E')] opacity-30"></div>
    
    <div class="relative w-full max-w-md px-4">
        <div class="bg-white/10 backdrop-blur-xl rounded-2xl shadow-2xl border border-white/20 p-8">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-gradient-to-r from-blue-500 to-cyan-500 mb-4">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                    </svg>
                </div>
                <h1 class="text-2xl font-bold text-white">Edit Profile</h1>
                <p class="text-gray-400 mt-2 text-sm">Update your information</p>
            </div>

            {% if messages %}
            <div id="alert-container" class="mb-6">
                {% for message in messages %}
                <div class="p-4 rounded-lg {% if message.tags == 'error' %}bg-red-500/20 border border-red-500/50 text-red-300{% else %}bg-green-500/20 border border-green-500/50 text-green-300{% endif %}">
                    <span>{{ message }}</span>
                </div>
                {% endfor %}
            </div>
            {% endif %}

            <form method="post" class="space-y-4">
                {% csrf_token %}
                
                <div class="flex flex-col items-center mb-4">
                    <img src="{{ user.profile.get_image_url|default:'https://ui-avatars.com/api/?name=user.username&background=3b82f6&color=fff&size=128&bold=true' }}" 
                        class="w-20 h-20 rounded-2xl object-cover border-4 border-blue-500 mb-3">
                </div>

                <div>
                    <label for="id_image_url" class="block text-sm font-medium text-gray-300 mb-2">Profile Picture URL</label>
                    <input type="url" name="image_url" id="id_image_url" value="{{ user.profile.image_url|default:'' }}" placeholder="https://example.com/avatar.jpg"
                        class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
                </div>

                <div>
                    <label for="id_first_name" class="block text-sm font-medium text-gray-300 mb-2">First Name</label>
                    <input type="text" name="first_name" id="id_first_name" value="{{ user.first_name }}"
                        class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
                </div>

                <div>
                    <label for="id_last_name" class="block text-sm font-medium text-gray-300 mb-2">Last Name</label>
                    <input type="text" name="last_name" id="id_last_name" value="{{ user.last_name }}"
                        class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
                </div>

                <div>
                    <label for="id_email" class="block text-sm font-medium text-gray-300 mb-2">Email</label>
                    <input type="email" name="email" id="id_email" value="{{ user.email }}" required
                        class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
                </div>

                <div>
                    <label for="id_bio" class="block text-sm font-medium text-gray-300 mb-2">Bio</label>
                    <textarea name="bio" id="id_bio" rows="2"
                        class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">{{ user.profile.bio|default:'' }}</textarea>
                </div>

                <button type="submit" 
                    class="w-full py-3 px-4 bg-gradient-to-r from-blue-500 to-cyan-500 hover:from-blue-600 hover:to-cyan-600 text-white font-semibold rounded-lg shadow-lg shadow-blue-500/30 transform hover:scale-[1.02] transition-all duration-200">
                    Save Changes
                </button>

                <a href="{% url 'profile' %}" 
                    class="block w-full py-3 px-4 bg-white/10 hover:bg-white/20 border border-white/20 text-white font-medium rounded-lg text-center transition-all">
                    Cancel
                </a>
            </form>
        </div>

        <p class="text-center text-gray-500 text-sm mt-6">
            &copy; 2026 Student Portal. All rights reserved.
        </p>
    </div>
</body>
</html>
