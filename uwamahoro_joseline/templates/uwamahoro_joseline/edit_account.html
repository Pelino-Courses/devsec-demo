{% extends "uwamahoro_joseline/base.html" %}

{% block title %}Edit Account — SecureAuth{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title">Edit Account</h1>
        <p class="page-subtitle">Update your account information.</p>
    </div>
</div>

<div class="card" style="max-width:500px">
    <div class="card-header">
        <h2 class="card-title">Account Settings</h2>
    </div>
    <div class="card-body">
        <form method="post" class="form-group">
            {% csrf_token %}
            
            <div style="margin-bottom:1.5rem">
                <label for="username" style="display:block;margin-bottom:.5rem;font-weight:600;color:var(--gray-900)">
                    Username
                </label>
                <input type="text" id="username" value="{{ target_user.username }}" disabled style="width:100%;padding:.75rem;border:1px solid var(--gray-300);border-radius:0.375rem;background:var(--gray-100);color:var(--gray-600);cursor:not-allowed">
                <p style="margin-top:.25rem;font-size:.8125rem;color:var(--gray-500)">Username cannot be changed.</p>
            </div>

            <div style="margin-bottom:1.5rem">
                <label for="email" style="display:block;margin-bottom:.5rem;font-weight:600;color:var(--gray-900)">
                    Email Address *
                </label>
                <input type="email" id="email" name="email" value="{{ target_user.email }}" required style="width:100%;padding:.75rem;border:1px solid var(--gray-300);border-radius:0.375rem;box-sizing:border-box">
                <p style="margin-top:.25rem;font-size:.8125rem;color:var(--gray-500)">We'll only use this for security alerts.</p>
            </div>

            <div style="display:flex;gap:1rem;margin-top:2rem">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a href="{% url 'uwamahoro_joseline:profile' %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
