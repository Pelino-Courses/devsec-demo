{% extends "uwamahoro_joseline/base.html" %}

{% block title %}Password Updated — SecureAuth{% endblock %}

{% block content %}
<div style="max-width:480px;margin:3rem auto;text-align:center">
    <div style="width:64px;height:64px;background:#ecfdf5;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1.25rem">
        <svg width="28" height="28" fill="none" viewBox="0 0 24 24" stroke="#059669" stroke-width="2">
            <path d="M20 6L9 17l-5-5"/>
        </svg>
    </div>
    <h1 style="font-size:1.375rem;font-weight:700;color:var(--gray-900);margin-bottom:.5rem">Password updated</h1>
    <p style="color:var(--gray-500);font-size:.875rem;margin-bottom:1.75rem">
        Your password has been changed successfully. You remain signed in on this device.
    </p>
    <div style="display:flex;gap:.75rem;justify-content:center">
        <a href="{% url 'uwamahoro_joseline:dashboard' %}" class="btn btn-primary">Go to dashboard</a>
        <a href="{% url 'uwamahoro_joseline:profile' %}" class="btn btn-secondary">View profile</a>
    </div>
</div>
{% endblock %}
