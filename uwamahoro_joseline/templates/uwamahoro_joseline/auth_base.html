<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SecureAuth{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #eff6ff;
            --error: #dc2626;
            --error-light: #fef2f2;
            --success-light: #ecfdf5;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-900: #111827;
            --white: #ffffff;
            --shadow-lg: 0 10px 15px rgba(0,0,0,.08), 0 4px 6px rgba(0,0,0,.04);
            --radius: 8px;
            --radius-lg: 14px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--gray-50);
            color: var(--gray-900);
            font-size: 14px;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image:
                radial-gradient(circle at 20% 20%, rgba(37,99,235,.06) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(124,58,237,.05) 0%, transparent 50%);
        }

        .auth-wrapper {
            width: 100%;
            max-width: 420px;
            padding: 1.5rem;
        }

        .auth-card {
            background: var(--white);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            padding: 2.25rem 2rem;
        }

        .auth-logo {
            display: flex;
            align-items: center;
            gap: 0.625rem;
            margin-bottom: 2rem;
            text-decoration: none;
            color: var(--gray-900);
        }

        .auth-logo-icon {
            width: 36px;
            height: 36px;
            background: var(--primary);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .auth-logo-text {
            font-size: 1rem;
            font-weight: 700;
        }

        .auth-heading {
            font-size: 1.375rem;
            font-weight: 700;
            color: var(--gray-900);
            margin-bottom: 0.25rem;
        }

        .auth-subheading {
            font-size: 0.875rem;
            color: var(--gray-500);
            margin-bottom: 1.75rem;
        }

        /* Form */
        .form-group { margin-bottom: 1.125rem; }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--gray-700);
            margin-bottom: 0.375rem;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            display: block;
            width: 100%;
            padding: 0.5625rem 0.75rem;
            font-size: 0.875rem;
            font-family: inherit;
            color: var(--gray-900);
            background: var(--white);
            border: 1px solid var(--gray-300);
            border-radius: var(--radius);
            transition: border-color .15s, box-shadow .15s;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37,99,235,.12);
        }

        .errorlist {
            list-style: none;
            color: var(--error);
            font-size: 0.8125rem;
            margin-top: 0.375rem;
        }

        .helptext {
            font-size: 0.8125rem;
            color: var(--gray-400);
            margin-top: 0.375rem;
            line-height: 1.5;
        }

        .form-error-banner {
            background: var(--error-light);
            border: 1px solid #fecaca;
            color: #991b1b;
            border-radius: var(--radius);
            padding: 0.75rem 1rem;
            font-size: 0.8125rem;
            margin-bottom: 1.25rem;
        }

        /* Button */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            padding: 0.5625rem 1.125rem;
            font-size: 0.875rem;
            font-weight: 600;
            font-family: inherit;
            border-radius: var(--radius);
            border: 1px solid transparent;
            cursor: pointer;
            text-decoration: none;
            transition: background .15s, box-shadow .15s, border-color .15s;
            line-height: 1.4;
        }

        .btn-primary { background: var(--primary); color: white; border-color: var(--primary); }
        .btn-primary:hover { background: var(--primary-dark); border-color: var(--primary-dark); box-shadow: 0 4px 6px rgba(37,99,235,.25); }

        .btn-secondary { background: var(--white); color: var(--gray-700); border-color: var(--gray-300); }
        .btn-secondary:hover { background: var(--gray-50); }

        .btn-danger { background: var(--white); color: var(--error); border-color: #fecaca; }
        .btn-danger:hover { background: var(--error-light); }

        .btn-full { width: 100%; }

        /* Divider */
        .auth-divider {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin: 1.5rem 0;
            color: var(--gray-400);
            font-size: 0.8125rem;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--gray-200);
        }

        /* Footer */
        .auth-footer {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.875rem;
            color: var(--gray-500);
        }

        .auth-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .auth-footer a:hover { text-decoration: underline; }

        /* Alert for messages */
        .alert {
            display: flex;
            align-items: flex-start;
            gap: 0.625rem;
            padding: 0.875rem 1rem;
            border-radius: var(--radius);
            margin-bottom: 1.25rem;
            font-size: 0.875rem;
            border: 1px solid transparent;
        }

        .alert-success { background: var(--success-light); color: #065f46; border-color: #a7f3d0; }
        .alert-info    { background: var(--primary-light); color: #1e40af; border-color: #bfdbfe; }
        .alert-error   { background: var(--error-light);   color: #991b1b; border-color: #fecaca; }
    </style>
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card">
        <a href="{% url 'uwamahoro_joseline:dashboard' %}" class="auth-logo">
            <span class="auth-logo-icon">
                <svg width="18" height="18" fill="none" viewBox="0 0 24 24">
                    <path d="M12 1C5.93 1 1 5.93 1 12s4.93 11 11 11 11-4.93 11-11S18.07 1 12 1zm0 2c4.97 0 9 4.03 9 9s-4.03 9-9 9-9-4.03-9-9 4.03-9 9-9zm-1 4v6l5 3-1 1.73-6-3.73V7h2z" fill="white"/>
                </svg>
            </span>
            <span class="auth-logo-text">SecureAuth</span>
        </a>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{% if message.tags == 'error' %}error{% elif message.tags == 'success' %}success{% else %}info{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </div>
</div>
</body>
</html>
