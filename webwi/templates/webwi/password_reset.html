{% extends 'webwi/base.html' %}

{% block content %}
<section class="card auth-card">
    <h1>Reset Password</h1>
    <p class="lead">Enter the email address for your account and we will send you a reset link.</p>

    <form method="post" novalidate>
        {% csrf_token %}

        <div class="field">
            <label for="{{ form.email.id_for_label }}">{{ form.email.label }}</label>
            {{ form.email }}
            {{ form.email.errors }}
        </div>

        <div class="actions">
            <button class="btn" type="submit">Send reset link</button>
            <a class="btn-ghost" href="{% url 'webwi:login' %}">Back to login</a>
        </div>
    </form>
</section>
{% endblock %}
