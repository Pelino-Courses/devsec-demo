<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
</head>
<body>
    <h1>Authenticated Dashboard</h1>
    <p>Welcome, {{ request.user.username }}.</p>
    <ul>
        <li><a href="{% url 'webwi:profile' %}">Profile</a></li>
        <li><a href="{% url 'webwi:password_change' %}">Change password</a></li>
        <li>
            <form method="post" action="{% url 'webwi:logout' %}">
                {% csrf_token %}
                <button type="submit">Logout</button>
            </form>
        </li>
    </ul>
</body>
</html>
