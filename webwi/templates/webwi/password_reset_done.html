{% extends 'webwi/base.html' %}

{% block content %}
<section class="card auth-card">
    <h1>Check Your Email</h1>
    <p class="lead">
        If an account exists for that email address, you will receive a password reset link shortly.
        Check your spam folder if it does not arrive within a few minutes.
    </p>
    <div class="actions">
        <a class="btn" href="{% url 'webwi:login' %}">Back to login</a>
    </div>
</section>
{% endblock %}
