<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UAS - {% block title %}{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
        }
        nav {
            background: #1a1a2e;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav .brand {
            color: #e94560;
            font-size: 20px;
            font-weight: bold;
        }
        nav a {
            color: #ffffff;
            text-decoration: none;
            margin-left: 20px;
            font-size: 14px;
        }
        nav a:hover {
            color: #e94560;
        }
        .container {
            max-width: 500px;
            margin: 50px auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            margin-bottom: 25px;
            color: #1a1a2e;
            font-size: 24px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #333;
            font-weight: bold;
        }
        input, textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            background: #fafafa;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #e94560;
            background: #fff;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background: #c73652;
        }
        .messages {
            margin-bottom: 20px;
        }
        .messages li {
            list-style: none;
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .messages .success {
            background: #d4edda;
            color: #155724;
        }
        .messages .error {
            background: #f8d7da;
            color: #721c24;
        }
        .errorlist {
            color: #721c24;
            font-size: 13px;
            margin-top: 4px;
            padding-left: 0;
            list-style: none;
        }
        .link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }
        .link a {
            color: #e94560;
            text-decoration: none;
        }
    </style>
</head>
<body>
    {% if user.is_authenticated %}
    <nav>
        <span class="brand">UAS Portal</span>
        <div>
            <a href="/auth/dashboard/">Dashboard</a>
            <a href="/auth/profile/">Profile</a>
            <a href="/auth/password-change/">Change Password</a>
            <a href="/auth/logout/">Logout</a>
        </div>
    </nav>
    {% endif %}

    <div class="container">
        {% if messages %}
        <ul class="messages">
            {% for message in messages %}
            <li class="{{ message.tags }}">{{ message }}</li>
            {% endfor %}
        </ul>
        {% endif %}

        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
