{% extends 'nkotanyib/base.html' %}

{% block title %}Password Changed{% endblock %}

{% block content %}
<div class="card" style="text-align: center;">
    <div style="width: 64px; height: 64px; background: rgba(16, 185, 129, 0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem auto;">
        <svg style="width: 32px; height: 32px; color: var(--success);" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
        </svg>
    </div>
    
    <h2 style="margin-bottom: 1rem;">Password Changed Successfully</h2>
    <p style="color: #cbd5e1; margin-bottom: 2rem;">Your password has been changed successfully.</p>
    
    <a href="{% url 'profile' %}" class="btn-primary">Return to Profile</a>
</div>
{% endblock %}
